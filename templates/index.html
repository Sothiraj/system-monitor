<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Monitor Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background: #101418; }
    .stat-card { border: 1px solid #232b33; border-radius: .5rem; background: #161c22; }
    .stat-value { font-size: 1.9rem; font-weight: 600; line-height: 1; }
    .chart-box { border: 1px solid #232b33; border-radius: .5rem; background: #161c22; padding: .75rem; }
    #statusDot { width: .6rem; height: .6rem; border-radius: 50%; display: inline-block; }
    .ok { background: #2ecc71; }
    .bad { background: #e74c3c; }
  </style>
</head>
<body class="text-white p-4">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">System Monitor</h2>
      <div class="small">
        <span id="statusDot" class="bad"></span>
        <span id="statusText" class="ms-2 text-secondary">connecting…</span>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card p-3">
          <div class="text-secondary small text-uppercase">Hostname</div>
          <div class="stat-value" id="hostname">—</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card p-3">
          <div class="text-secondary small text-uppercase">Platform</div>
          <div class="small pt-2" id="platform">—</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card p-3">
          <div class="text-secondary small text-uppercase">Uptime</div>
          <div class="stat-value" id="uptime">—</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card p-3">
          <div class="text-secondary small text-uppercase">Cores</div>
          <div class="stat-value" id="cores">—</div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6"><div class="chart-box"><canvas id="cpuChart"></canvas></div></div>
      <div class="col-md-6"><div class="chart-box"><canvas id="ramChart"></canvas></div></div>
      <div class="col-md-6"><div class="chart-box"><canvas id="diskChart"></canvas></div></div>
      <div class="col-md-6"><div class="chart-box"><canvas id="netChart"></canvas></div></div>
    </div>
  </div>

  <script>
    const MAX_POINTS = 30;
    const REFRESH_MS = 3000;

    const grid = { color: 'rgba(255,255,255,.07)' };
    const tick = { color: '#8b98a5' };

    // Percent charts share a fixed 0-100 axis so a real spike is visible.
    function createPercentChart(ctxId, label, color) {
      return new Chart(document.getElementById(ctxId), {
        type: 'line',
        data: { labels: [], datasets: [{ label, data: [], borderColor: color,
          backgroundColor: color + '33', borderWidth: 2, fill: true, tension: .35, pointRadius: 0 }] },
        options: {
          animation: false, responsive: true, maintainAspectRatio: true,
          plugins: { legend: { labels: { color: '#e6edf3' } } },
          scales: {
            x: { grid, ticks: { ...tick, display: false } },
            y: { min: 0, max: 100, grid, ticks: { ...tick, callback: v => v + '%' } }
          }
        }
      });
    }

    function createNetChart(ctxId) {
      const base = { borderWidth: 2, fill: true, tension: .35, pointRadius: 0 };
      return new Chart(document.getElementById(ctxId), {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'Sent', data: [], borderColor: '#e67e22', backgroundColor: '#e67e2233', ...base },
            { label: 'Received', data: [], borderColor: '#1abc9c', backgroundColor: '#1abc9c33', ...base }
          ]
        },
        options: {
          animation: false, responsive: true, maintainAspectRatio: true,
          plugins: { legend: { labels: { color: '#e6edf3' } } },
          scales: {
            x: { grid, ticks: { ...tick, display: false } },
            y: { beginAtZero: true, grid, ticks: { ...tick, callback: v => v + ' MB' } }
          }
        }
      });
    }

    const cpuChart = createPercentChart('cpuChart', 'CPU %', '#e74c3c');
    const ramChart = createPercentChart('ramChart', 'RAM %', '#2ecc71');
    const diskChart = createPercentChart('diskChart', 'Disk %', '#f39c12');
    const netChart = createNetChart('netChart');

    function push(chart, time, ...values) {
      if (chart.data.labels.length >= MAX_POINTS) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
      }
      chart.data.labels.push(time);
      chart.data.datasets.forEach((ds, i) => ds.data.push(values[i]));
      chart.update('none');
    }

    function formatUptime(seconds) {
      const s = Math.floor(seconds);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h ${m}m`;
      return `${m}m ${s % 60}s`;
    }

    function setStatus(ok, text) {
      document.getElementById('statusDot').className = ok ? 'ok' : 'bad';
      const el = document.getElementById('statusText');
      el.textContent = text;
      el.className = ok ? 'ms-2 text-secondary' : 'ms-2 text-danger';
    }

    async function fetchStats() {
      try {
        // Relative URL: the browser talks to whatever origin served this page.
        const res = await fetch('/stats', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const time = new Date().toLocaleTimeString();

        document.getElementById('hostname').textContent = data.hostname;
        document.getElementById('platform').textContent = data.platform;
        document.getElementById('uptime').textContent = formatUptime(data.uptime);
        document.getElementById('cores').textContent = data.cpu_count;

        push(cpuChart, time, data.cpu);
        push(ramChart, time, data.ram);
        push(diskChart, time, data.disk);
        push(netChart, time, data.net_sent, data.net_recv);

        setStatus(true, 'live · updated ' + time);
      } catch (err) {
        setStatus(false, 'error: ' + err.message);
      }
    }

    fetchStats();
    setInterval(fetchStats, REFRESH_MS);
  </script>
</body>
</html>
